<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task1{% endblock %} — Task1</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f0e17;
            color: #e8e6f0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════ */
        .sidebar {
            width: 272px;
            min-width: 272px;
            background: #16151f;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            padding: 0;
            height: 100vh;
            transition: width 0.2s ease;
        }

        /* Logo bar */
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 16px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6c3fc4, #9b59b6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon svg { width: 17px; height: 17px; fill: white; }

        .logo-text {
            font-size: 17px;
            font-weight: 700;
            color: #f0eeff;
            letter-spacing: -0.3px;
        }

        /* New Chat Button */
        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: calc(100% - 24px);
            margin: 14px 12px 10px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #6c3fc4, #8b52d4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.1px;
            transition: opacity 0.15s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(108,63,196,0.35);
        }

        .new-chat-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .new-chat-btn:active { transform: translateY(0); }

        .new-chat-btn svg { width: 16px; height: 16px; fill: white; flex-shrink: 0; }

        /* Thread section label */
        .threads-label {
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #55526a;
            padding: 8px 16px 6px;
        }

        /* Thread list */
        .thread-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
            scrollbar-width: thin;
            scrollbar-color: #2e2b40 transparent;
        }

        .thread-list::-webkit-scrollbar { width: 4px; }
        .thread-list::-webkit-scrollbar-thumb { background: #2e2b40; border-radius: 4px; }

        .thread-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border-radius: 8px;
            margin-bottom: 2px;
            color: #b8b4d0;
            font-size: 13.5px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 6px;
        }

        .thread-item:hover { background: rgba(255,255,255,0.05); color: #e8e6f0; }

        .thread-item.active {
            background: rgba(108,63,196,0.18);
            color: #e8e6f0;
        }

        .thread-item.active .thread-title { color: #d4c8ff; }

        .thread-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(108,63,196,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .thread-icon svg { width: 13px; height: 13px; fill: #9b75e8; }

        .thread-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13.5px;
        }

        .thread-item a {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #44415a;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 4px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .thread-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: #e07060 !important; }

        .no-chats {
            color: #44415a;
            font-size: 13px;
            padding: 12px 10px;
            text-align: center;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 12px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c3fc4, #e07060);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .user-info { flex: 1; overflow: hidden; }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: #e8e6f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-form { display: inline; }

        .logout-btn {
            background: none;
            border: none;
            color: #55526a;
            cursor: pointer;
            font-size: 11.5px;
            padding: 0;
            font-family: inherit;
            transition: color 0.15s;
        }

        .logout-btn:hover { color: #e07060; }

        /* ═══════════════════════════════════════
           MAIN CONTENT
        ═══════════════════════════════════════ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0e17;
            overflow: hidden;
        }

        /* Empty / center page state */
        .center-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 14px;
            color: #3d3a52;
        }

        .empty-state-icon {
            width: 56px;
            height: 56px;
            background: rgba(108,63,196,0.12);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-icon svg { width: 28px; height: 28px; fill: #6c3fc4; opacity: 0.7; }

        .empty-state p {
            font-size: 15px;
            color: #3d3a52;
            font-weight: 500;
        }

        /* scrollbar for main */
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-thumb { background: #2a273d; border-radius: 4px; }

        /* ═══════════════════════════════════════
           AUTH (login/signup) — kept for safety
        ═══════════════════════════════════════ */
        .auth-box {
            background: #1c1a2a;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.4);
            width: 360px;
            border: 1px solid rgba(255,255,255,0.07);
        }

        .auth-box h2 { margin-top: 0; margin-bottom: 20px; color: #f0eeff; }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #b8b4d0;
        }

        .auth-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255,255,255,0.05);
            color: #f0eeff;
            font-family: inherit;
            outline: none;
        }

        .auth-box input:focus {
            border-color: #6c3fc4;
            box-shadow: 0 0 0 3px rgba(108,63,196,0.2);
        }

        .auth-box input::placeholder { color: #44415a; }

        .auth-box button[type="submit"] {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: linear-gradient(135deg, #6c3fc4, #8b52d4);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(108,63,196,0.4);
            transition: opacity 0.15s;
        }

        .auth-box button[type="submit"]:hover { opacity: 0.9; }
        .auth-box .helper-link { text-align: center; margin-top: 16px; font-size: 13px; color: #7a7590; }
        .auth-box .helper-link a { color: #9b75e8; text-decoration: none; font-weight: 600; }
        .field-error { color: #e07060; font-size: 12px; margin-top: 4px; }
        .help-text { font-size: 11px; color: #55526a; margin-top: 4px; line-height: 1.5; }
        .help-text ul { margin: 4px 0 0; padding-left: 16px; }
        .errorlist { color: #e07060; font-size: 12px; padding-left: 0; list-style: none; margin-top: 4px; }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <div class="sidebar">
        <!-- Header -->
        <div class="sidebar-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                </svg>
            </div>
            <span class="logo-text">Task1</span>
        </div>

        <!-- New Chat -->
        <form method="post" action="{% url 'thread_list' %}">
            {% csrf_token %}
            <button class="new-chat-btn" type="submit">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                </svg>
                New Chat
            </button>
        </form>

        <div class="threads-label">Recent Chats</div>

        <!-- Thread List -->
        <div class="thread-list">
            {% for t in threads %}
                <div class="thread-item {% if thread and thread.id == t.id %}active{% endif %}">
                    <a href="{% url 'thread_detail' t.id %}">
                        <div class="thread-icon">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                            </svg>
                        </div>
                        <span class="thread-title">{{ t.title }}</span>
                    </a>
                    <form method="post" action="{% url 'thread_delete' t.id %}" onsubmit="return confirm('Delete this chat?');">
                        {% csrf_token %}
                        <button class="delete-btn" type="submit" title="Delete">✕</button>
                    </form>
                </div>
            {% empty %}
                <div class="no-chats">No chats yet</div>
            {% endfor %}
        </div>

        <!-- Footer -->
        <div class="sidebar-footer">
            <div class="user-avatar">{{ user.username|first }}</div>
            <div class="user-info">
                <div class="user-name">{{ user.username }}</div>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Sign out</button>
                </form>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="main">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
