<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}Task1{% endblock %} — Task1</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background: #0f0e17;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f0e17;
            color: #e8e6f0;
            display: flex;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ═══════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════ */
        .sidebar {
            width: 272px;
            min-width: 272px;
            background: #16151f;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.2s ease;
            z-index: 100;
        }

        /* Logo bar */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + var(--sat)) 16px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6c3fc4, #9b59b6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon svg { width: 17px; height: 17px; fill: white; }

        .logo-text {
            font-size: 17px;
            font-weight: 700;
            color: #f0eeff;
            letter-spacing: -0.3px;
        }

        .sidebar-close-btn {
            display: none;
            background: rgba(255,255,255,0.06);
            border: none;
            color: #b8b4d0;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar-close-btn:hover, .sidebar-close-btn:active {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        /* New Chat Button */
        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: calc(100% - 24px);
            margin: 14px 12px 10px;
            padding: 11px 14px;
            background: linear-gradient(135deg, #6c3fc4, #8b52d4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.1px;
            transition: opacity 0.15s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(108,63,196,0.35);
        }

        .new-chat-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .new-chat-btn:active { transform: translateY(0); }
        .new-chat-btn svg { width: 16px; height: 16px; fill: white; flex-shrink: 0; }

        /* Thread section label */
        .threads-label {
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #55526a;
            padding: 8px 16px 6px;
        }

        /* Thread list */
        .thread-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 8px;
            scrollbar-width: thin;
            scrollbar-color: #2e2b40 transparent;
        }

        .thread-list::-webkit-scrollbar { width: 4px; }
        .thread-list::-webkit-scrollbar-thumb { background: #2e2b40; border-radius: 4px; }

        .thread-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 10px;
            border-radius: 8px;
            margin-bottom: 3px;
            color: #b8b4d0;
            font-size: 13.5px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 6px;
        }

        .thread-item:hover, .thread-item:active {
            background: rgba(255,255,255,0.06);
            color: #e8e6f0;
        }

        .thread-item.active {
            background: rgba(108,63,196,0.22);
            color: #e8e6f0;
        }

        .thread-item.active .thread-title { color: #d4c8ff; font-weight: 600; }

        .thread-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(108,63,196,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .thread-icon svg { width: 13px; height: 13px; fill: #9b75e8; }

        .thread-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13.5px;
        }

        .thread-item a {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            min-width: 0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #55526a;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 4px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity 0.15s, color 0.15s, background 0.15s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thread-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover, .delete-btn:active {
            color: #e07060 !important;
            background: rgba(224, 112, 96, 0.12);
        }

        .no-chats {
            color: #55526a;
            font-size: 13px;
            padding: 24px 10px;
            text-align: center;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 12px 14px calc(12px + var(--sab));
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c3fc4, #e07060);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .user-info { flex: 1; overflow: hidden; min-width: 0; }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: #e8e6f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-form { display: inline; }

        .logout-btn {
            background: none;
            border: none;
            color: #7a7590;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 0;
            font-family: inherit;
            transition: color 0.15s;
        }

        .logout-btn:hover, .logout-btn:active { color: #e07060; }

        /* ═══════════════════════════════════════
           SIDEBAR BACKDROP (Mobile)
        ═══════════════════════════════════════ */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .sidebar-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* ═══════════════════════════════════════
           MAIN CONTENT
        ═══════════════════════════════════════ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0e17;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            min-width: 0;
            position: relative;
        }

        /* Empty / center page state */
        .center-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: #55526a;
            text-align: center;
            padding: 24px;
        }

        .empty-state-icon {
            width: 64px;
            height: 64px;
            background: rgba(108,63,196,0.12);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-icon svg { width: 32px; height: 32px; fill: #6c3fc4; opacity: 0.8; }

        .empty-state p {
            font-size: 15px;
            color: #7a7590;
            font-weight: 500;
            max-width: 320px;
            line-height: 1.5;
        }

        .empty-state-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 240px;
            margin-top: 8px;
        }

        .empty-state-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            width: 100%;
        }

        .empty-state-btn.primary {
            background: linear-gradient(135deg, #6c3fc4, #8b52d4);
            color: #fff;
            border: none;
            box-shadow: 0 4px 14px rgba(108,63,196,0.35);
        }

        .empty-state-btn.secondary {
            background: rgba(255,255,255,0.06);
            color: #b8b4d0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .empty-state-btn:active { transform: scale(0.98); }

        /* scrollbar for main */
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-thumb { background: #2a273d; border-radius: 4px; }

        /* ═══════════════════════════════════════
           MOBILE RESPONSIVE BREAKPOINT
        ═══════════════════════════════════════ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 84vw;
                max-width: 310px;
                min-width: 0;
                height: 100%;
                height: 100dvh;
                transform: translateX(-100%);
                box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-backdrop {
                display: block;
                z-index: 999;
            }

            .sidebar-close-btn {
                display: flex;
            }

            .delete-btn {
                opacity: 1;
                font-size: 15px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <div class="sidebar" id="app-sidebar">
        <!-- Header -->
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                    </svg>
                </div>
                <span class="logo-text">Task1</span>
            </div>
            <button class="sidebar-close-btn" type="button" onclick="toggleSidebar(false)" aria-label="Close menu">✕</button>
        </div>

        <!-- New Chat -->
        <form method="post" action="{% url 'thread_list' %}">
            {% csrf_token %}
            <button class="new-chat-btn" type="submit">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                </svg>
                New Chat
            </button>
        </form>

        <div class="threads-label">Recent Chats</div>

        <!-- Thread List -->
        <div class="thread-list">
            {% for t in threads %}
                <div class="thread-item {% if thread and thread.id == t.id %}active{% endif %}">
                    <a href="{% url 'thread_detail' t.id %}" onclick="if (window.innerWidth <= 768) toggleSidebar(false);">
                        <div class="thread-icon">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                            </svg>
                        </div>
                        <span class="thread-title">{{ t.title }}</span>
                    </a>
                    <form method="post" action="{% url 'thread_delete' t.id %}" onsubmit="return confirm('Delete this chat?');">
                        {% csrf_token %}
                        <button class="delete-btn" type="submit" title="Delete" aria-label="Delete chat">✕</button>
                    </form>
                </div>
            {% empty %}
                <div class="no-chats">No chats yet</div>
            {% endfor %}
        </div>

        <!-- Footer -->
        <div class="sidebar-footer">
            <div class="user-avatar">{{ user.username|first }}</div>
            <div class="user-info">
                <div class="user-name">{{ user.username }}</div>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Sign out</button>
                </form>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="main">
        {% block content %}{% endblock %}
    </div>

    <script>
        function toggleSidebar(forceState) {
            var sidebar = document.getElementById('app-sidebar');
            var backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar) return;
            var shouldOpen = typeof forceState === 'boolean' ? forceState : !sidebar.classList.contains('open');
            if (shouldOpen) {
                sidebar.classList.add('open');
                if (backdrop) backdrop.classList.add('open');
                document.body.classList.add('sidebar-open');
            } else {
                sidebar.classList.remove('open');
                if (backdrop) backdrop.classList.remove('open');
                document.body.classList.remove('sidebar-open');
            }
        }
    </script>
</body>
</html>
